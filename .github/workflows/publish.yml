name: Test and publish npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      KNOWBASE_SKIP_AUTOSTART: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm version availability
        id: release
        run: node .github/scripts/check-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish new version with npm OIDC
        if: steps.release.outputs.should_publish == 'true'
        run: npm publish --access public --tag latest
      - name: Already published
        if: steps.release.outputs.should_publish != 'true'
        run: echo "This version already exists on npm; publication skipped."
